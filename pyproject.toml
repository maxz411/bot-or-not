[project]
name = "bot-or-not"
version = "0.1.0"
description = "Python-only fine-tuning workflow for bot-or-not."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-cloud-aiplatform>=1.121.0",
    "google-cloud-storage>=3.2.0",
    "google-genai>=1.70.0",
    "openai>=2.21.0",
    "questionary>=2.1.0",
]

[project.scripts]
fine-tuning = "fine_tuning.cli:main"
fine-tuning-interactive = "fine_tuning.interactive:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fine_tuning"]

[tool.uv]
package = true
